name: release

# 发布流程与版本策略见 docs/release-process.md

on:
  push:
    branches: [main, '[0-9]+.[0-9]+.x']

permissions:
  contents: read

jobs:
  version:
    if: '!github.event.created && !github.event.deleted'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: 检查项目配置是否变化
        id: project
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          git fetch --no-tags --depth=1 origin "$BEFORE_SHA"
          changed=$(git diff --name-only "$BEFORE_SHA" "$GITHUB_SHA" -- pyproject.toml)
          if [[ -n "$changed" ]]; then
            git show "$BEFORE_SHA:pyproject.toml" > "$RUNNER_TEMP/previous-pyproject.toml"
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi

      - uses: astral-sh/setup-uv@v5
        if: steps.project.outputs.changed == 'true'
        with:
          python-version: '3.12'

      - name: 检查版本变化并推送标签
        if: steps.project.outputs.changed == 'true'
        id: tag
        run: |
          version_changed=$(uv run --no-project python - "$RUNNER_TEMP/previous-pyproject.toml" <<'PY'
          import sys
          import tomllib

          with open(sys.argv[1], "rb") as previous, open("pyproject.toml", "rb") as current:
              print(tomllib.load(previous)["project"]["version"] != tomllib.load(current)["project"]["version"])
          PY
          )
          if [[ "$version_changed" != 'True' ]]; then
            exit 0
          fi

          tag="v$(uv version --short)"
          if [[ ! "$tag" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo '::error::发布标签必须采用 vX.Y.Z 格式。'
            exit 1
          fi
          maintenance_branch="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.x"
          if [[ "$GITHUB_REF_NAME" != 'main' && "$GITHUB_REF_NAME" != "$maintenance_branch" ]]; then
            echo "::error::版本 $tag 应在 main 或 $maintenance_branch 发布。"
            exit 1
          fi

          tag_ref="refs/tags/$tag"
          existing_tag=$(git ls-remote --refs origin "$tag_ref")
          if [[ -n "$existing_tag" ]]; then
            git fetch --no-tags --depth=1 origin "$tag_ref"
            if [[ "$(git rev-parse 'FETCH_HEAD^{commit}')" != "$GITHUB_SHA" ]]; then
              echo "::error::发布标签 $tag 已指向其他提交，请选择一个未被占用且高于现有标签的版本。"
              exit 1
            fi
          else
            git push origin "$GITHUB_SHA:$tag_ref"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  ci:
    needs: version
    if: needs.version.outputs.tag != ''
    uses: ./.github/workflows/ci.yml

  build:
    needs: [version, ci]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.12'

      - name: 校验发布标签
        env:
          RELEASE_TAG: ${{ needs.version.outputs.tag }}
        run: |
          expected_tag="v$(uv version --short)"
          if [[ "$RELEASE_TAG" != "$expected_tag" ]]; then
            echo "::error::发布标签 $RELEASE_TAG 与根目录 pyproject.toml 对应的 $expected_tag 不一致。"
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 构建 Python 发行包
        run: uv build --all-packages --no-create-gitignore --out-dir dist

      - name: 打包 OpenCode npm 插件
        working-directory: packages/opencode-file-provenance
        run: npm pack --pack-destination ../../dist

      - uses: actions/upload-artifact@v4
        with:
          name: release-packages
          path: dist/
          if-no-files-found: error

  publish:
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: release-${{ needs.version.outputs.tag }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-packages
          path: dist

      - name: 发布 GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.version.outputs.tag }}
        run: |
          shopt -s nullglob
          packages=(dist/*.whl dist/*.tar.gz dist/*.tgz)
          if (( ${#packages[@]} == 0 )); then
            echo "::error::dist 目录中没有可发布的发行包。"
            exit 1
          fi
          if release_json=$(gh release view "$RELEASE_TAG" --json isDraft,assets 2>/dev/null); then
            if [[ "$(jq -r '.isDraft' <<< "$release_json")" == 'false' ]]; then
              for package in "${packages[@]}"; do
                if ! jq -e --arg name "${package##*/}" 'any(.assets[]; .name == $name)' <<< "$release_json" >/dev/null; then
                  echo "::error::Release $RELEASE_TAG 缺少附件 ${package##*/}。"
                  exit 1
                fi
              done
              exit 0
            fi
            echo "删除已存在的草稿 release ${RELEASE_TAG}。"
            gh release delete "$RELEASE_TAG" --yes
          fi
          release_flags=(--verify-tag --generate-notes)
          if [[ "$GITHUB_REF_NAME" != 'main' ]]; then
            release_flags+=(--latest=false)
          fi
          gh release create "$RELEASE_TAG" "${release_flags[@]}" "${packages[@]}"
